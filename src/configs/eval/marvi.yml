# Selectivity eval config (MARVI localizer example: faces).
# Paths resolve from the environment (.env) via ${oc.env:VAR}. Only the `raw` recompute
# path loads this file; the default precomputed figure path never does.
data:
  batch_size: 1
  lm_reduce: mean
  mode: video
  odd_or_even: all
  stimuli_root: ${oc.env:STIMULI_DIR}/marvi_videos_faces
  vis_reduce: mean
model:
  device: cuda
  # model: epfl-neuroai/topo-omni   # optional override (HF id or local dir); default: $TOPO_OMNI_MODEL
run:
  category_name: faces
  do_pretrained: false
  output_root: ${oc.env:SAVE_DIR,results}
  overwrite: false
  run_title: topo-omni
stats:
  alpha: 0.001
  fwhm_mm: 4.0
  resolution_mm: 1.0
  smooth: true
  topk_pct: 0
