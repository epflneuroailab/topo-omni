# CONTINUOUS sheet + IMAGES alongside the videos.
#
# Identical to train_continuous_4096.yml except for the data: an image manifest is
# trained beside the Koala clips, in its own batches.
#
# WHY IMAGES. The spatial loss is a corrcoef over `unified_sheet.reshape(T, -1)`, and T
# is set by the forward's token pooling, not by the batch size. Measured on
# checkpoint-69 (all numbers from src/experiments/, not estimates):
#
#     step content            T      effective dim
#     1 video                57            7.0
#     4 videos (a step)    ~228           12.1
#     64 still images        64           24.3
#
# A video step's 228 samples are 57 time-chunks of each of 4 clips, and a 20 s clip
# barely changes across those chunks -- so the correlation the loss is built on spans
# only ~12 dimensions. 64 stills span twice that from a quarter of the samples. The
# spatial loss has been shaping a 417,792^2 correlation structure from ~12 effective
# dimensions; this is the cheapest way to raise that.
#
# It also fixes an axis mismatch with the readout: the orientation eval correlates units
# across 638 grating STIMULI, while training correlates across time-chunks of one clip.
# An image contributes exactly one sample, so on an image step the sample axis IS the
# stimulus axis, the same one the eval reads.
#
# WHAT AN IMAGE COSTS: 93 sequence tokens and 256 visual patches, against a video's 3605
# and 13,156. So image-batch-size 224 is roughly the sequence cost of the 4-video batch
# and lands on the same T.
#
# CONSTRAINT: images and videos are never mixed inside a batch. The thinker forward
# indexes `audio_time_steps_all` by batch position but only fills it for items carrying
# audio, so a mixed batch dies with "a Tensor with 0 elements cannot be converted to
# Scalar". ModalityBatchSampler (src/training/batching.py) keeps batches homogeneous and keeps
# every DDP rank on the same modality at the same step.
#
# CAVEAT: an image drives no audio encoder, so on image steps the audio half of the
# encoder band is all zeros and `drop-dead-units: true` masks it. Image steps train the
# vision and thinker bands only.
#
# REQUIRES TOPO_SHEET_LAYOUT=continuous, as train_continuous_4096.yml does.
run-title: topo-omni-continuous-4096-images

# Videos: the default DATA_PATH manifest is used when data-path is unset.
#
# Images: two manifests, both staged by src/tools/prepare_images.py (centre-crop to a
# square, then resize to 224) and indexed by src/tools/build_image_manifest.py.
#
#   imagenet_images.json -- 49,900 images, 50 per class across 998 classes, drawn from
#     32 of the 294 ILSVRC/imagenet-1k train shards. The TDANN precedent: their V1
#     orientation maps come from SimCLR on ImageNet. ILSVRC shards are shuffled across
#     classes, so a subset of shards is already class-balanced.
#     139,448 images are staged on disk at ~/datasets/imagenet-224; the manifest caps
#     the count, so raising it is a rebuild of the manifest, not another download:
#       python -m src.tools.build_image_manifest --images-dir ~/datasets/imagenet-224 \
#           --labels-from-dirname --per-class 140 --shuffle-seed 0 \
#           --out data/imagenet_images.json  # from the repo ROOT
#
#   dtd_images.json -- 5,640 Describable Textures images, 47 categories, a third of them
#     explicitly oriented (banded, striped, lined, grid, zigzagged). Kept alongside
#     ImageNet because an image is pooled to ONE sample that is the mean over all its
#     patches, and a globally coherent texture survives that averaging better than a
#     cluttered scene. Measured: a natural photo carries 3.2x less per-unit variance
#     than a full-field grating -- attenuated, though NOT degenerate (natural photos
#     still span ~24 effective dimensions against a video step's ~12).
#
# WHY CENTRE-CROPPED RATHER THAN SQUASHED: image-side forces a square resize that does
# not preserve aspect ratio, and squashing a 500x375 photo rotates every oriented edge
# in it. On a run whose whole readout is an orientation map that is a confound, so the
# staged copies are already square and the pipeline's resize is a no-op in aspect terms.
image-data-path:
  - ../data/imagenet_images.json
  - ../data/dtd_images.json
# EVERY image is resized to exactly this square. Not cosmetic: the thinker forward's
# no-audio path initialises `text_time_steps` once before the per-item loop and then
# ratchets it down inside it, resetting per item only on the audio branch -- so images
# with different visual token counts pool to far fewer samples than there are images.
# Measured on 16 native-size DTD images: T = 2 instead of 16. Pinning the processor's
# min_pixels/max_pixels is NOT enough (smart_resize keeps aspect ratio and rounds to
# multiples of 28, leaving 234..272 tokens); an explicit resize is.
# 224 gives 256 patches / 64 tokens, exactly what the eval's sine gratings produce, so
# training and eval present the vision encoder with identically shaped inputs.
image-side: 224

debug: false

train:
  n-epochs: 5
  batch-size: 4
  grad-accum: 4
  learning-rate: 5.e-5
  lr-scheduler: cosine
  warmup-ratio: 0.03
  weight-decay: 0.01
  apply-spatial-loss: true
  # PER RANK, and exactly T on an image step (one sample per image).
  #
  # MEASURED peak memory for one forward+backward on an 80 GiB H100, image-side 224,
  # 8000 neighbourhoods, gradient checkpointing on:
  #     batch  16 -> 20.4 GiB   (T=16)
  #     batch  64 -> 38.3 GiB   (T=64)
  #     batch 128 -> 62.0 GiB   (T=128)
  #     batch 224 -> OOM
  # 96 is the recommendation: ~50 GiB, leaving room for DDP buffers and for the
  # allocator fragmentation a long run accumulates. 128 fits in isolation but has
  # almost no margin.
  #
  # 96 samples beats what a video step actually delivers despite the smaller nominal T:
  # 4 clips give T~228 but only ~12 EFFECTIVE dimensions, where 64 stills already give
  # ~24. Below ~64 the corrcoef does get noticeably noisier (SE ~ 1/sqrt(T)).
  image-batch-size: 96
  # Fraction of OPTIMIZER STEPS that are image steps. null = whatever the two pools
  # naturally give, which is what you want here.
  #
  # DELIBERATELY NOT 0.5. The ratio is honoured by CAPPING the over-represented side
  # rather than repeating data inside an epoch, so with 55,540 images (144 image steps
  # at 96/rank x 4 ranks) against 4,365 clips (272 video steps), asking for 0.5 would
  # cap the VIDEO side down to 144 and silently discard nearly half the clips each
  # epoch. Left null, both pools are used in full:
  #     272 video steps + 144 image steps = 416/epoch, a natural ratio of 0.35.
  # Set it explicitly only if you want to trade one side away on purpose.
  #
  # NOTE an image step drives no audio encoder, so the audio band's adaptors get ~35%
  # fewer updates than in the video-only baseline. Fine for a vision-band orientation
  # readout, but this run is not a clean control for anything measured on the audio side.
  image-step-ratio: null


topo-params:
  alpha: 20
  accum: mean
  activation-decay: 0
  # 309x512 coordinates (158,208 units). The old ...unified-20-v3... directory holds
  # 304x512 coords and is rejected at load time by the unit-count check in
  # `_load_or_build_coordinates`.
  position-dir: neighborhoods/model=qwen2-5omni-3b-continuous-4096-v6_radius=4_neighborhoods=20_coords=42
  # Tokens pooled into ONE spatial-loss sample. Each pooled step is one row of
  # `activations`, i.e. one sample in the unit x unit `corrcoef` the loss is built on.
  # Measured on real Koala-36M batches (20 s clips, 25 audio tokens/s, batch 4):
  #   chunk 50 -> T ~21   (rank <= 20 of 768; pairwise r has SE ~1/sqrt(21) = 0.22)
  #   chunk  5 -> T ~224  (rank <= 223;                        SE ~0.067, 3.3x tighter)
  # Video/text chunks are derived from the audio step count, so every band gains samples.
  # 50 reproduces the original behaviour.
  audio-chunk: 5

  cortical-init: 0.001
  identity-init: true

  neighborhood:
    # dynamic: neighborhood radius grows with depth, resolved on the fly from
    #          coords.npy alone (no precomputed table needed)
    # fixed:   single radius for the whole sheet, read from the precomputed
    #          neighborhood_indices.npy under position-dir
    mode: dynamic
    # CONSTANT radius: min == max, so every encoder slot and thinker layer gets 12.
    # The 5->25 schedule applied the loss at a different spatial scale at each depth,
    # which confounds every depth-resolved measurement (per-slot gate rate, OSI, clustering
    # ratio) -- you cannot separate "organised differently here" from "loss applied at a
    # different scale here". It also gave each depth its own intrinsic Lambda, which is why
    # the measured Lambda was a blend (82.5 px along rows vs 51.2 along columns) and why the
    # controls' Lambda wandered 10-26 px. One radius -> one Lambda.
    # 12 also keeps a neighbourhood (25x25 = 625 units) under the 768 cap, so the cap never
    # binds, and matches TDANN's single neighborhood_width per map.
    radius-min: 5
    # radius at the last encoder slot, and constant across every thinker layer
    radius-max: 5
    # linear | geometric | area-linear
    schedule: linear
    # 1000 centers, as in train_c1000.yml. The early encoder slots sit at radius 5, so
    # their neighborhoods hold ~100 units and each gives a very noisy correlation
    # estimate; at 136 centers the L0-3 gradient direction was only cos=+0.02
    # self-consistent across independent draws. At 1000 centers that rises to +0.52 and
    # L16-31 also improves (+0.20 -> +0.37). Cost: >=3x the spatial-loss compute per
    # step, and with every unit live (video input) all 1000 neighborhoods are actually
    # evaluated rather than ~640.
    #
    # NOTE `depth_band_ids` keys bands on the depth ROW only, so vision and audio share
    # band ids: 33 encoder slots + 36 thinker layers = 69 bands, up from 68. A ~1.5%
    # dilution of the per-band budget, which is why per-band counts differ slightly
    # from the c1000 run.
    neighborhoods-per-batch: 8000
    # only used when coords.npy is missing and coordinates are rebuilt
    coords-seed: 42

    # --- gradient balance across depth (see spatial_utils.spatial_loss_fn) ---
    # Mask zero-variance units out of a neighborhood (and never pick one as a center)
    # instead of discarding the whole neighborhood.
    drop-dead-units: true
    # Weight each neighborhood by its units' activation scale. OFF: under the dynamic
    # 5->25 schedule the early layers already receive ~7x MORE gradient per unit than
    # late ones, so this flag over-corrects. Only enable with mode: fixed.
    scale-balance: false
    # Give every encoder / thinker slot a guaranteed quota of neighborhood centers per
    # step instead of sampling uniformly over units.
    stratify-by-depth: true
    # How the per-step center budget is split across depth bands.
    #   uniform        -- equal share per band
    #   inverse-size   -- share proportional to 1/radius^2, equalising unit-memberships
    #                     per band. Across the 5->25 schedule that is a 25:1 tilt towards
    #                     the shallow bands.
    #   inverse-radius -- share proportional to 1/radius. Same direction, but only a 5:1
    #                     tilt, so the deep large-radius bands keep a much larger share.
    #
    # Using inverse-radius here: at 1000 centers the 1/r^2 allocation was measured to
    # over-correct, speeding up the early layers ~7.7x while dropping the DEEP layers to
    # a fraction of their old drift rate, which risks the layers 16-31 topography that
    # already worked. 1/r keeps the shallow-band oversampling that fixed early vision
    # without starving the deep bands. Measured on this sheet at 1000 centers:
    #
    #                        1/r^2      1/r
    #   encoder slots 0-7      496      270   (0.54x -- still heavily oversampled)
    #   encoder slots 16-32    145      212
    #   thinker layers         194      360
    #   deep total             339      572   (1.69x)
    # uniform, not inverse-radius: with a constant radius every band has the same
    # neighbourhood size, so the 1/r weighting is a no-op (centres per band go from a 4.6x
    # spread under 5->25 to 1.1x). Saying uniform is honest rather than relying on a
    # correction that now does nothing.
    center-allocation: uniform
    # Cap units per neighborhood. local_spatial_loss holds a (K, K) distance and a (K, K)
    # correlation matrix per neighborhood in the autograd graph, so memory grows as K^2.
    # NOTE this cap matters MORE under inverse-radius than under inverse-size: shifting
    # budget towards the deep, radius-25 bands means more large neighborhoods per step.
    # Measured: mean neighborhood size rises 658 -> 1018 units (400 -> 551 after the
    # cap), so total (K,K) pair memory is ~1.55x the 1/r^2 run -- 245M -> 378M pairs.
    # Uncapped it would be a further 4.2x. If this run OOMs, drop the cap to ~512 or
    # cut neighborhoods-per-batch before touching center-allocation.
    max-neighborhood-units: 768
