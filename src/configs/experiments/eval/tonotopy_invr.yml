# Tonotopy for the front-end-slot run, evaluated mid-training at checkpoint-276/690.
run:
  run_title: topo-omni-frontend-invr-ckpt276
  category_name: tonotopy
  output_root: ${oc.env:SAVE_DIR,results}
  do_pretrained: false
  overwrite: true

model:
  device: cuda
  model: src/ckpts/topo-omni-frontend-invr/checkpoint-276

data:
  mode: audio
  stimuli_root: ${oc.env:STIMULI_DIR}/tone_bank
  batch_size: 1
  lm_reduce: mean
  vis_reduce: mean

stats:
  alpha: 0.05
  topk_pct: 0
  smooth: true
  # 3.0: run.py used to hard-code this width, so 3.0 is what the figures in results/ were
  # actually made with. The 2.0 that used to sit here never reached the smoother.
  fwhm_mm: 3.0
  resolution_mm: 1.0
