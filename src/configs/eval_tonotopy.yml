# Tonotopy eval config. Paths resolve from the environment (.env) via ${oc.env:VAR}.
# Only the `raw` recompute path loads this file. The pure-tone bank can be regenerated
# with `python -m src.utils.generate_frequencies` (see README).
run:
  # Used in output paths: <output_root>/<run_title>/<category_name>/...
  run_title: topo-omni
  category_name: tonotopy
  output_root: ${oc.env:SAVE_DIR,results}
  do_pretrained: false
  overwrite: true

model:
  device: cuda
  # model: epfl-neuroai/topo-omni   # optional override (HF id or local dir); default: $TOPO_OMNI_MODEL

data:
  mode: audio
  stimuli_root: ${oc.env:STIMULI_DIR}/tone_bank
  batch_size: 1
  lm_reduce: mean
  vis_reduce: mean

stats:
  alpha: 0.05
  topk_pct: 0
  smooth: true
  fwhm_mm: 2.0
  resolution_mm: 1.0
