run-title: topo-omni-gradbalance
debug: false

train:
  n-epochs: 10
  batch-size: 4
  grad-accum: 4
  learning-rate: 5.e-5
  lr-scheduler: cosine
  warmup-ratio: 0.03
  weight-decay: 0.01
  apply-spatial-loss: true

topo-params:
  alpha: 20
  accum: mean
  activation-decay: 0
  position-dir: neighborhoods/model=qwen2-5omni-3b-unified-frontend-20-v4_radius=20_neighborhoods=20_coords=42
  cortical-init: 0.001
  identity-init: true

  neighborhood:
    # dynamic: neighborhood radius grows with depth, resolved on the fly from
    #          coords.npy alone (no precomputed table needed)
    # fixed:   single radius for the whole sheet, read from the precomputed
    #          neighborhood_indices.npy under position-dir
    mode: dynamic
    # radius at the first vision / audio encoder layer
    radius-min: 5
    # radius at the last encoder layer, and constant across every thinker layer
    radius-max: 25
    # linear | geometric | area-linear
    schedule: linear
    # Raised from 100. The early encoder layers sit at radius 5, so their neighborhoods
    # hold ~100 units and each one gives a very noisy correlation estimate: at 136 centers
    # the L0-3 gradient direction was only cos=+0.02 self-consistent across independent
    # draws, i.e. essentially random, which is why those adaptors random-walked instead of
    # organising. At 1000 centers with inverse-size allocation that rises to +0.52, and
    # L16-31 also improves (+0.20 -> +0.37). Measured on driven vision units, so it holds
    # for audiovisual batches; the neighborhood-size argument behind it is pure geometry.
    # Cost: >=3x the spatial-loss compute per step, and with every unit live (video input)
    # all 1000 neighborhoods are actually evaluated rather than ~640, so budget for more.
    neighborhoods-per-batch: 400
    # only used when coords.npy is missing and coordinates are rebuilt
    coords-seed: 42

    # --- gradient balance across depth (see spatial_utils.spatial_loss_fn) ---
    # Mask zero-variance units out of a neighborhood (and never pick one as a center)
    # instead of discarding the whole neighborhood, which is what the bare
    # `if not torch.isnan(loss)` guard used to do.
    # NOTE: training here is on VIDEO (audiovisual), so both encoder bands are driven and
    # this should be a no-op -- it is kept as a safety net for any batch where a modality
    # is absent or padded, and it matters for image-only evals, where the dead audio band
    # killed 123 of 400 sampled neighborhoods.
    drop-dead-units: true
    # Weight each neighborhood by its units' activation scale, cancelling the loss's
    # 1/std gradient sensitivity. OFF: that 1/std deficit was measured under a FIXED
    # radius-20 sheet. Under the dynamic 5->25 schedule below, early layers already
    # receive ~7x MORE gradient per unit than late ones (small radius -> few pairs ->
    # large per-unit share), so this flag over-corrects: it drives the
    # L16-31/L0-3 gradient ratio from 0.15 to 0.09. Only enable with mode: fixed.
    scale-balance: false
    # Give every encoder / thinker layer a guaranteed quota of neighborhood centers per
    # step instead of sampling uniformly over units.
    stratify-by-depth: true
    # How the per-step center budget is split across depth bands.
    #   uniform      -- equal share per layer
    #   inverse-size -- share proportional to 1/radius^2, so the small-radius early layers
    #                   get many more centers to average down their noisy correlation
    #                   estimates. Nearly free: local_spatial_loss is O(size^2), so a
    #                   radius-5 neighborhood costs ~1/160 of a radius-25 one.
    center-allocation: inverse-size
    # Cap units per neighborhood. local_spatial_loss holds a (K, K) distance and a (K, K)
    # correlation matrix per neighborhood in the autograd graph, so memory grows as K^2.
    # Uncapped, a 1000-center step fragmented the allocator enough to OOM the task loss's
    # ~15 GiB logits allocation on an 80 GB card. Subsampling a neighborhood's members is
    # an unbiased sample of its pairs.
    max-neighborhood-units: 768
