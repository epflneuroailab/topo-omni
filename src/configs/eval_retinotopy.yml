# Retinotopy eval config. Paths resolve from the environment (.env) via ${oc.env:VAR}.
# Only the `raw` recompute path loads this file. The retinotopy stimulus bank can be
# regenerated with `python -m src.utils.generate_retinotopy` (see README).
run:
  run_title: topo-omni
  category_name: retinotopy
  output_root: ${oc.env:SAVE_DIR,results}
  do_pretrained: false
  overwrite: true

model:
  device: cuda
  # model: epfl-neuroai/topo-omni   # optional override (HF id or local dir); default: $TOPO_OMNI_MODEL

data:
  mode: image
  stimuli_root: ${oc.env:STIMULI_DIR}/retino_bank
  batch_size: 1
  lm_reduce: mean
  vis_reduce: mean

stats:
  alpha: 0.05
  smooth: true
  fwhm_mm: 2.0
  resolution_mm: 1.0
