[pytest]
# importlib mode avoids sys.path games; dataset tests load their flat make_figures.py
# by explicit path under a unique module name (each dataset has its own), so a single
# root `pytest` run does not collide on the bare `make_figures` / `config` names.
addopts = --import-mode=importlib
testpaths = core Pernet_2015 Marvi_2025 Jung_2025
python_files = test_*.py
