      - numpy==2.0.2
      - scipy==1.13.1
      - nibabel==5.2.1
      - nilearn==0.10.4
      - pandas==2.2.2
      - scikit-learn==1.5.1
      - statsmodels==0.14.2
      - patsy==0.5.6
      - formulaic==0.5.2
      - joblib==1.4.2
      - threadpoolctl==3.5.0
      - matplotlib==3.9.1
      - seaborn==0.13.2
